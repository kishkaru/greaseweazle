# prefix: sony.

# Sony SMC-777 Sony Filer / SMC-DOS, 70 cyls x 16 x 256, 3:1 interleave.
# (The drive runs at 600rpm; 250kbps@300rpm is the equivalent flux density.)
# Note: .1dd images are D88 containers and use the SONY1DD image class.
disk 1dd
    cyls = 70
    heads = 1
    tracks * ibm.mfm
        bps = 256
        secs = 16
        interleave = 3
        id = 1
        rate = 250
        iam = yes
    end
end
